        type: array
      created_at:
        description: CreatedAt holds the value of the "created_at" field.
        type: string
      description:
        description: Description holds the value of the "description" field.
        type: string
      downloaded:
        description: Downloaded holds the value of the "downloaded" field.
        type: boolean
      edges:
        allOf:
        - $ref: '#/definitions/ent.DontStarveModEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the DontStarveModQuery when eager-loading is set.
      id:
        description: ID of the ent.
        type: string
      image:
        description: Image holds the value of the "image" field.
        type: string
      name:
        description: Name holds the value of the "name" field.
        type: string
      raw_config:
        description: RawConfig holds the value of the "raw_config" field.
