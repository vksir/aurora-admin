paths:
  /api/{service}/{action}:
    post:
      consumes:
      - application/json
      parameters:
      - description: service
        enum:
        - dontstarve
        in: path
        name: service
        required: true
        type: string
      - description: action
        enum:
        - start
        - stop
        - restart
        - install
        - uninstall
        - update
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/comety.Response'
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 服务控制
      tags:
      - service_control
  /api/{service}/status:
