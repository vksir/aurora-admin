      world_override:
        type: string
    type: object
  ent.DontStarveAdmin:
    properties:
      created_at:
        description: CreatedAt holds the value of the "created_at" field.
        type: string
      id:
        description: ID of the ent.
        type: string
      klei_id:
        description: KleiID holds the value of the "klei_id" field.
        type: string
      name:
        description: Name holds the value of the "name" field.
        type: string
      updated_at:
        description: UpdatedAt holds the value of the "updated_at" field.
        type: string
    type: object
  ent.DontStarveArchive:
    properties:
      cluster_description:
        description: ClusterDescription holds the value of the "cluster_description"
          field.
        type: string
      cluster_name:
        description: ClusterName holds the value of the "cluster_name" field.
        type: string
      cluster_password:
        description: ClusterPassword holds the value of the "cluster_password" field.
        type: string
      created_at:
        description: CreatedAt holds the value of the "created_at" field.
        type: string
      edges:
        allOf:
        - $ref: '#/definitions/ent.DontStarveArchiveEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the DontStarveArchiveQuery when eager-loading is set.
      id:
        description: ID of the ent.
        type: string
      max_players:
        description: MaxPlayers holds the value of the "max_players" field.
        type: integer
      pvp:
        description: Pvp holds the value of the "pvp" field.
        type: boolean
      remark:
        description: Remark holds the value of the "remark" field.
        type: string
      updated_at:
        description: UpdatedAt holds the value of the "updated_at" field.
        type: string
      world:
        description: World holds the value of the "world" field.
        items:
          $ref: '#/definitions/dstety.DontStarveWorld'
        type: array
    type: object
  ent.DontStarveArchiveEdges:
    properties:
      mods:
        description: Mods holds the value of the mods edge.
        items:
          $ref: '#/definitions/ent.DontStarveMod'
        type: array
    type: object
  ent.DontStarveMod:
    properties:
