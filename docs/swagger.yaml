        - dontstarve
        in: path
        name: service
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'status: Inactive, Active, Starting, Stopping, WaitingActive,
            Abnormal'
          schema:
            allOf:
            - $ref: '#/definitions/comety.Status'
            - properties:
                status:
                  type: string
              type: object
        "500":
          description: Internal Server Error
